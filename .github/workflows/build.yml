name: 构建 Windows exe

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Python 依赖
        shell: pwsh
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 生成配置文件
        shell: cmd
        run: |
          copy config.example.yaml config.yaml

      - name: 打包为 exe
        shell: cmd
        run: |
          pyinstaller --clean qr_checker.spec

      - name: 复制配置文件
        shell: cmd
        run: |
          copy config.yaml dist\
          copy config.example.yaml dist\
          copy wechat_ids.txt dist\

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: QRChecker-Windows
          path: dist/
